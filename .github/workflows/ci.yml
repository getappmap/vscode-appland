name: CI

on:
  push:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    # Installs dependencies, runs lint/typecheck (pretest), and compiles the
    # extension. Results are cached for the downstream jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        id: cache-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-modules-
      - uses: actions/cache@v5
        id: cache-out
        with:
          path: out
          key: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: yarn
      - run: yarn install --immutable
      - run: yarn pretest # lint + typecheck
      - run: yarn compile

  unit:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-build
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- yarn test:unit
        name: Run unit tests

  integration:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-build
      # Cache the large binaries the integration tests need so they aren't re-downloaded on
      # every run. Rolling keys (unique per run + a prefix restore-key) always restore the most
      # recent cache and save a refreshed one, so upstream version bumps are picked up.
      - name: Cache VS Code test binary
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-vscode-test-
      - name: Cache AppMap CLI tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.appmap
            ~/.cache/appmap
          key: ${{ runner.os }}-appmap-tools-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-appmap-tools-
      # Download the binaries in dedicated steps (restored from cache when unchanged) so their
      # latency stays out of the timing-sensitive tests and a download failure is obvious here
      # rather than surfacing as a mysterious test timeout.
      - name: Download VS Code test binary
        run: yarn test:precache
      - name: Download AppMap CLI tools
        run: yarn download-tools
      - run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          dbus-daemon --session --address=$DBUS_SESSION_BUS_ADDRESS --nofork --nopidfile --syslog-only &
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- yarn test:integration
        name: Run integration tests

  build-vsix:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      # Full history is required so that git describe can walk back to find the nearest tag.
      # Without this, checkout defaults to a shallow clone (depth=1) and git describe fails.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/restore-build
      # Use git describe to embed a development indicator in the version for non-release builds.
      # On a tagged commit this produces the plain version (e.g. 1.2.3); on any other commit it
      # appends distance and hash (e.g. 1.2.3-12-gabcdef), making dev artifacts distinguishable
      # from published releases. --no-update-package-json keeps package.json clean.
      - name: Build VSIX package
        run: yarn vsce package --no-git-tag-version --no-update-package-json $(git describe --tags --always | cut -c2-)
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-appland.vsix
          path: '*.vsix'
          archive: false

  release:
    runs-on: ubuntu-latest
    needs: [unit, integration, build-vsix]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/cache@v5
        id: cache-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: ${{ runner.os }}-modules-
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: yarn
      - run: yarn semantic-release
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_BOT_GITHUB_TOKEN }}
          VSCE_TOKEN: ${{ secrets.SEMANTIC_RELEASE_BOT_VSCE_TOKEN }}
          GIT_AUTHOR_NAME: appland-release
          GIT_AUTHOR_EMAIL: release@app.land
          GIT_COMMITTER_NAME: appland-release
          GIT_COMMITTER_EMAIL: release@app.land
